name: Deploy Apeiron X to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify original-yummy mechanics and complete arcade suite
        run: |
          node --check apeiron-bonuses.js
          node tests/yummies.test.cjs
          node tests/smoke.test.cjs
          node tests/director-balance.test.cjs
          node tests/scores.test.cjs
          node tests/bot-play.test.cjs
          node tests/arcade-feel.test.cjs
          node tests/psychedelic.test.cjs
      - name: Install Chromium test runner
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test iPhone, iPad and desktop browser presentation
        run: node --test tests/browser-yummies.test.cjs tests/browser-psychedelic.test.cjs
      - name: Validate classic arcade HUD structure
        run: node tests/hud-play.test.cjs
      - name: Test Classic Arcade touch and menu controls
        run: node --test tests/browser-hud.test.cjs
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload browser QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apeiron-yummies-release-screenshots
          path: test-artifacts/*.png
          if-no-files-found: ignore
      - name: Stage only deployable browser assets
        run: |
          mkdir -p site
          cp index.html art.js living-patch.js psychedelic-fx.js arcade-director.js arcade-scores.js apeiron-bonuses.js play-arcade.js play-arcade.css .nojekyll site/
          cp -R vendor site/
      - name: Upload static HTML game
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
