name: Apeiron X regression tests
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'art.js'
      - 'living-patch.js'
      - 'tests/**'
      - '.github/workflows/arcade-tests.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'art.js'
      - 'living-patch.js'
      - 'tests/**'
jobs:
  smoke:
    name: Gameplay and mobile HUD smoke test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run simulation
        run: node tests/smoke.test.cjs
