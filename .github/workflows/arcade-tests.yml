name: Apeiron X regression tests
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'art.js'
      - 'living-patch.js'
      - 'psychedelic-fx.js'
      - 'apeiron-bonuses.js'
      - 'arcade-director.js'
      - 'arcade-scores.js'
      - 'tests/**'
      - '.github/workflows/arcade-tests.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'art.js'
      - 'living-patch.js'
      - 'psychedelic-fx.js'
      - 'apeiron-bonuses.js'
      - 'tests/**'
jobs:
  smoke:
    name: Gameplay and mobile HUD smoke test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run simulation
        run: |
          node --check apeiron-bonuses.js
          node tests/yummies.test.cjs
          node tests/smoke.test.cjs
          node tests/director-balance.test.cjs
          node tests/scores.test.cjs
          node tests/bot-play.test.cjs
          node tests/arcade-feel.test.cjs
          node tests/psychedelic.test.cjs
      - name: Install Chromium test runner
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Validate mobile and desktop gameplay
        run: node --test tests/browser-yummies.test.cjs tests/browser-psychedelic.test.cjs
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apeiron-yummies-browser-screenshots
          path: test-artifacts/*.png
          if-no-files-found: ignore
